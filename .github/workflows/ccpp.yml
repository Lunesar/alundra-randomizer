name: Compile

on: [push]

jobs:
  linux:

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v1
    - name: cmake
      run: cmake -G "Unix Makefiles"
      working-directory: "."
    - name: make
      run: make
      working-directory: "."
    - name: Pack the patcher tools
      run: |
        set -euo pipefail
        tools=dist/patcher/linux/tools
        mkdir -p "$tools"
        strip -o "dist/patcher/linux/alundra-randomizer" alundra-randomizer
        curl -fsSL -o mkpsxiso.zip https://github.com/Lameguy64/mkpsxiso/releases/download/v2.30/mkpsxiso-2.30-Linux.zip
        unzip -q mkpsxiso.zip -d mkpsxiso
        find mkpsxiso -type f -name dumpsxiso -exec cp {} "$tools/dumpsxiso" \;
        find mkpsxiso -type f -name mkpsxiso -exec cp {} "$tools/mkpsxiso" \;
        for name in LICENSE.md README.md; do
          found=$(find mkpsxiso -type f -name "$name" | head -1)
          if [ -z "$found" ]; then
            curl -fsSL -o "$tools/$name" "https://raw.githubusercontent.com/Lameguy64/mkpsxiso/v2.30/$name"
          else
            cp "$found" "$tools/$name"
          fi
          test -s "$tools/$name"
        done
        chmod +x dist/patcher/linux/alundra-randomizer "$tools/dumpsxiso" "$tools/mkpsxiso"
    - name: Pack the randomizer package
      run: |
        set -euo pipefail
        src=dist/patcher/linux
        pkg=dist/player/linux
        dest=$pkg/alundra-randomizer
        rm -rf "$pkg"
        mkdir -p "$pkg"
        cp -a "$src" "$dest"
        cp -a release_package/presets "$dest/presets"
        cp -a release_package/personal_settings.json "$dest/personal_settings.json"
        mkdir -p "$dest/seeds"
        test -d "$dest/seeds"
        test -x "$dest/alundra-randomizer"
        test -x "$dest/tools/dumpsxiso"
        test -x "$dest/tools/mkpsxiso"
        test -s "$dest/presets/default.json"
        test -s "$dest/personal_settings.json"
        test ! -e "$dest/gen_preset.bat"
        test ! -e "$dest/gen_permalink.bat"
        test ! -e "$src/presets"
        test ! -e "$src/seeds"
        test ! -e "$src/personal_settings.json"
        test ! -e "$src/gen_preset.bat"
        test ! -e "$src/gen_permalink.bat"
        mapfile -t seed_files < <(find "$dest/seeds" -type f -print)
        if [ ${#seed_files[@]} -ne 0 ]; then
          echo "player seeds/ must stay empty" >&2
          printf '%s\n' "${seed_files[@]}" >&2
          exit 1
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: alundra-aptools-linux
        path: dist/patcher/linux/
    - uses: actions/upload-artifact@v4
      with:
        name: alundra-randomizer-linux
        path: dist/player/linux/
        if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -S . -B build -A x64
    - name: Build
      run: cmake --build build --config Release --target alundra-randomizer
    - name: Pack the patcher tools
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $tools = "dist/patcher/win32/tools"
        New-Item -ItemType Directory -Force -Path $tools | Out-Null
        Copy-Item "build/Release/alundra-randomizer.exe" "dist/patcher/win32/alundra-randomizer.exe"
        Invoke-WebRequest -Uri "https://github.com/Lameguy64/mkpsxiso/releases/download/v2.30/mkpsxiso-2.30-win64.zip" -OutFile "mkpsxiso.zip"
        Expand-Archive "mkpsxiso.zip" -DestinationPath "mkpsxiso"
        Copy-Item (Get-ChildItem -Recurse -Filter "dumpsxiso.exe" "mkpsxiso").FullName "$tools/dumpsxiso.exe"
        Copy-Item (Get-ChildItem -Recurse -Filter "mkpsxiso.exe" "mkpsxiso").FullName "$tools/mkpsxiso.exe"
        foreach ($name in @("LICENSE.md", "README.md")) {
          $found = Get-ChildItem -Recurse -Filter $name "mkpsxiso" | Select-Object -First 1
          if ($found) {
            Copy-Item $found.FullName "$tools/$name"
          } else {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Lameguy64/mkpsxiso/v2.30/$name" -OutFile "$tools/$name"
          }
          if (-not (Test-Path "$tools/$name") -or (Get-Item "$tools/$name").Length -eq 0) {
            throw "mkpsxiso $name was not saved"
          }
        }
    - name: Pack the randomizer package
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $src = "dist/patcher/win32"
        $pkg = "dist/player/win64"
        $dest = "$pkg/alundra-randomizer"
        if (Test-Path $pkg) { Remove-Item -Recurse -Force $pkg }
        New-Item -ItemType Directory -Force -Path $pkg | Out-Null
        Copy-Item -Path $src -Destination $dest -Recurse
        Copy-Item -Path "release_package/presets" -Destination $dest -Recurse
        Copy-Item -Path "release_package/personal_settings.json" -Destination $dest
        Copy-Item -Path "release_package/gen_preset.bat","release_package/gen_permalink.bat" -Destination $dest
        New-Item -ItemType Directory -Force -Path "$dest/seeds" | Out-Null
        foreach ($rel in @(
          "alundra-randomizer.exe",
          "tools/dumpsxiso.exe",
          "tools/mkpsxiso.exe",
          "presets/default.json",
          "personal_settings.json",
          "gen_preset.bat",
          "gen_permalink.bat",
          "seeds"
        )) {
          if (-not (Test-Path "$dest/$rel")) {
            throw "player package is missing $rel"
          }
        }
        foreach ($bat in @("gen_preset.bat", "gen_permalink.bat")) {
          $text = Get-Content -Raw "$dest/$bat"
          if ($text -notmatch '%~dp0' -or $text -notmatch 'alundra-randomizer\.exe') {
            throw "$bat must run alundra-randomizer.exe from its own directory"
          }
        }
        foreach ($rel in @("presets", "seeds", "personal_settings.json", "gen_preset.bat", "gen_permalink.bat")) {
          if (Test-Path "$src/$rel") {
            throw "patcher folder was changed: $rel"
          }
        }
        $extras = @(Get-ChildItem -Force -Recurse -File "$dest/seeds")
        if ($extras.Count -ne 0) {
          throw "player seeds/ must stay empty"
        }
    - uses: actions/upload-artifact@v4
      with:
        name: alundra-aptools-win64
        path: dist/patcher/win32/
    - uses: actions/upload-artifact@v4
      with:
        name: alundra-randomizer-win64
        path: dist/player/win64/
        if-no-files-found: error
